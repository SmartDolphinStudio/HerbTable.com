name: Audit CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.19.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.97.1
      - run: |
          for app in web/public web/admin; do
            (cd "$app" && npm ci --ignore-scripts && npm run build && npm audit --audit-level=low)
          done
      - run: |
          for service in cmd/api-server server/captcha; do
            (cd "$service" && go test -race ./... && go vet ./...)
          done
      - run: cd server/security && cargo fmt --all -- --check && cargo test --locked
