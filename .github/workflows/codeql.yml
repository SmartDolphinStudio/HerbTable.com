name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "javascript-typescript", "go", "rust"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: matrix.language == 'go'
        with:
          go-version: '1.26.5'
          cache: false
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - name: Build Go modules for analysis
        if: matrix.language == 'go'
        run: |
          (cd cmd/api-server && go build -a ./...)
          (cd server/captcha && go build -a ./...)
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          category: '/language:${{ matrix.language }}'
