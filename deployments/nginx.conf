server {
    listen 80;
    server_name herbtable.com www.herbtable.com;
    root /var/www/herbtable.com/public-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicit SPA fallback routes for full-screen React pages.
    location /docs {
        try_files $uri $uri/ /index.html;
    }

    location /payment {
        try_files $uri $uri/ /index.html;
    }

    location /login {
        try_files $uri $uri/ /index.html;
    }

    location /enterprise-login {
        try_files $uri $uri/ /index.html;
    }

    location /ai {
        try_files $uri $uri/ /index.html;
    }

    location /api/captcha/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name astraeus.herbtable.com;
    root /var/www/herbtable.com/admin-dashboard;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
